<input type="text" id="search-input" placeholder="Pesquisar por fornecedor...">
<input list="obra-list" id="obra-filter-input" placeholder="Filtrar por obra...">
<datalist id="obra-list"></datalist>
<label><input type="checkbox" id="obra-only-filter" checked> Somente Obras</label>
<select id="year-filter"></select>
<select id="controlado-filter">
    <option value="controlados">Apenas Controlados</option>
    <option value="todos">Todos os Materiais</option>
    <option value="nao_controlados">Apenas Não Controlados</option>
</select>
<select id="sort-order">
    <option value="most_deliveries">Mais Entregas</option>
    <option value="highest_value">Maior Valor</option>
    <option value="most_nc_deliveries">Mais Entregas Não Conformes</option>
    <option value="highest_nc_value">Maior Valor Não Conforme</option>
    <option value="highest_nc_percent">% Entregas Não Conformes</option>
    <option value="highest_nc_value_percent">% Valor Não Conforme</option>
</select>
